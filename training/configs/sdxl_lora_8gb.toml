# kohya-ss/sd-scripts config for the SDXL style LoRA, sized to an 8 GB RTX 5060.
# Used by scripts/train_style_lora.sh via `sdxl_train_network.py --config_file`.
# If it OOMs, lower resolution to 512 first; only then touch rank or batch size.

pretrained_model_name_or_path = "stabilityai/stable-diffusion-xl-base-1.0"
train_data_dir = "data/curated/style"
output_dir = "data/checkpoints/style-lora-v1"
output_name = "style-lora-v1"
logging_dir = "data/checkpoints/style-lora-v1/logs"

resolution = "768,768"
enable_bucket = true
min_bucket_reso = 512
max_bucket_reso = 1024
bucket_reso_steps = 64

network_module = "networks.lora"
network_dim = 8
network_alpha = 4
network_train_unet_only = true

train_batch_size = 1
gradient_accumulation_steps = 4
gradient_checkpointing = true
max_train_steps = 1500
save_every_n_steps = 250
save_model_as = "safetensors"

learning_rate = 1e-4
lr_scheduler = "constant"
optimizer_type = "AdamW8bit"

mixed_precision = "bf16"
save_precision = "bf16"
full_bf16 = true
xformers = true
cache_latents = true
cache_latents_to_disk = true
cache_text_encoder_outputs = true
no_half_vae = true

caption_extension = ".txt"
shuffle_caption = false
keep_tokens = 1
seed = 42
max_data_loader_n_workers = 2
