[project]
name = "ghost-agent-training"
version = "0.1.0"
description = "Dataset pull, curation, and LoRA / VLM fine-tuning for the Ghost Agent pipeline (Lenovo Legion)."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "Pillow>=10.0",
    "psd-tools>=1.10",
    "numpy>=1.26",
    "pyarrow>=15",
]

[project.optional-dependencies]
# Installed on the Legion only. Pick the torch build for CUDA 12.x from pytorch.org first.
train = [
    "torch>=2.4",
    "transformers>=4.45",
    "datasets>=2.19",
    "peft>=0.13",
    "bitsandbytes>=0.44",
    "accelerate>=1.0",
    "safetensors>=0.4",
    "qwen-vl-utils>=0.0.8",
]
dev = ["pytest>=8", "ruff>=0.5", "black>=24"]

[project.scripts]
ghost-pull = "ghost_training.pull:main"
ghost-prepare = "ghost_training.prepare:main"
ghost-push = "ghost_training.push:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ghost_training*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
# The evaluation matrix is a table of prompt sentences.
"ghost_training/eval_faces.py" = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311", "py312", "py313"]

[tool.pytest.ini_options]
testpaths = ["tests"]
