# Local development overlay: MinIO instead of Contabo object storage, ports open on
# localhost, nginx not needed.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
services:
  api:
    environment:
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: devuser
      S3_SECRET_KEY: devpassword
    depends_on: [postgres, redis, minio]
    volumes: ["./app:/srv/app:ro"]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    environment:
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: devuser
      S3_SECRET_KEY: devpassword
    volumes: ["./app:/srv/app:ro"]

  nginx:
    profiles: ["prod"]

  postgres:
    ports: ["127.0.0.1:5433:5432"]

  redis:
    ports: ["127.0.0.1:6379:6379"]

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    environment:
      MINIO_ROOT_USER: devuser
      MINIO_ROOT_PASSWORD: devpassword
    volumes: ["miniodata:/data"]

  minio-init:
    image: minio/mc
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 devuser devpassword; do sleep 1; done;
      mc mb --ignore-existing local/ghostagent;
      exit 0"

volumes:
  miniodata:
