# Reverse proxy in front of the API. Replace ghost.example.com with the real host and
# obtain certificates with certbot before enabling the 443 block.
server {
    listen 80;
    server_name ghost.example.com;
    client_max_body_size 512m;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location /socket.io/ {
        proxy_pass http://api:8000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
