# Overlay for the shared Contabo VPS: the host already runs nginx on 80/443, so the
# nginx service here is disabled and the host nginx proxies to 127.0.0.1:8000 once a
# hostname exists. Object storage is a local MinIO on the same box until Contabo S3
# credentials are configured (then drop this service and set S3_* in .env).
#   docker compose -f docker-compose.yml -f docker-compose.vps.yml up -d --build
services:
  api:
    environment:
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    depends_on: [postgres, redis, minio]

  worker:
    environment:
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    depends_on: [postgres, redis, minio]

  nginx:
    profiles: ["disabled"]

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes: ["miniodata:/data"]
    restart: unless-stopped

volumes:
  miniodata:
